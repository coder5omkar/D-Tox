# D-Tox build settings — lightweight by design.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Build with Android Studio's bundled JDK (21).
# The system JDK (26) is too new for the Android Gradle plugin.
# Note: the colon in the drive letter must be escaped in .properties files.
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr
